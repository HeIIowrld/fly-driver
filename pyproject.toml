[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mecar-flybrain"
version = "0.1.0"
description = "Connectome and proprioception experiments for steering vehicles on 3D roads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "gymnasium>=1.1,<2"]

[project.optional-dependencies]
physics = ["mujoco>=3.3,<4"]
learning = ["torch>=2.5,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
lua-tests = ["lupa==2.8"]
remote = ["paramiko>=3.5,<5"]
connectome = ["pyarrow>=18,<27"]
capture = ["mss==10.2.0"]
wgc = ["windows-capture==2.0.1; sys_platform == 'win32'"]
teacher = ["torch>=2.5,<3", "scipy>=1.15,<2"]

[project.scripts]
flybrain = "flybrain_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
